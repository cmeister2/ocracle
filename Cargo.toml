[package]
name = "ocracle"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
description = "Neural OCR for Magic: The Gathering card text, historic type and italics"
license = "MIT"
repository = "https://github.com/cmeister2/ocracle"
homepage = "https://cmeister2.github.io/ocracle/"
readme = "README.md"
keywords = ["ocr", "mtg", "neural-network", "magic", "cards"]
categories = ["computer-vision", "command-line-utilities"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[features]
default = []
# Applications supply the native ONNX Runtime library; no binary downloads.
onnxruntime = ["dep:ort"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ocrs = "0.13.1"
rten = "0.26"
rten-imageproc = "0.26"
rten-tensor = "0.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[dev-dependencies]
tempfile = "=3.27.0"
