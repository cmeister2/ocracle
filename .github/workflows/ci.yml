name: Rust, release tooling, and gallery

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.94.0"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ${{ matrix.toolchain }}
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Independent MSRV verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-msrv@0.19.3
      - run: cargo msrv verify -- cargo check --locked --all-targets --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: python3 training/download_models.py
      - run: cargo llvm-cov --locked --all-targets --all-features --lcov --output-path lcov.info -- --include-ignored
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

  release-tooling:
    name: Release dependency graph regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  neural:
    name: Neural OCR on real card crops
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: neural
      - run: python3 training/download_models.py
      - run: python3 scripts/verify_models.py --require-models
      - run: cargo test --release --locked --test neural -- --ignored

  training:
    name: Training and degradation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r training/requirements.txt
      - run: python -m unittest discover -s training -p 'test_*.py'
      - run: python training/latin-eval/verify.py
      - run: python training/latin_v2_check.py
      - run: python training/experimental_colour/evaluate.py --check
      - run: python training/experimental_paddle_candidates/evaluate.py --check
      - run: python training/punctuation-corpus/prepare.py --check
      - run: python training/rare-scripts/prepare.py --check
      - run: python training/style-eval/prepare.py --check
      - run: python training/style-eval/score.py --check
      - run: python training/style-eval/score.py --detected --check

  native-training:
    name: Native Paddle training and Rust export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            training/experimental_paddle_training/requirements.lock
            training/experimental_paddle_training/requirements-export.lock
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: native-training
          workspaces: |
            . -> target
            training/experimental_paddle/runner -> target
      - name: Cache the pinned official native checkpoint
        uses: actions/cache@v6.1.0
        with:
          path: training/experimental_paddle_training/cache/official-small.pdparams
          key: native-paddle-${{ hashFiles('training/experimental_paddle_training/source-checkpoint.json') }}
      - name: Install the CPU training and export environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-extra
          python -m venv "$RUNNER_TEMP/paddle-training"
          "$RUNNER_TEMP/paddle-training/bin/python" -m pip install --require-hashes -r training/experimental_paddle_training/requirements.lock -r training/experimental_paddle_training/requirements-export.lock
          printf '%s\n' "$RUNNER_TEMP/paddle-training/bin" >> "$GITHUB_PATH"
      - name: Download the exact official ONNX and native sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from training.download_models import fetch
          source = json.loads(Path('training/experimental_paddle/model-source.json').read_text())
          model = source['files']['inference.onnx']
          fetch(model['url'], Path('models/ppocr-v6-small.onnx'), model['sha256'])
          PY
          python training/experimental_paddle_training/bootstrap.py
      - name: Verify exact-weight native and ONNX parity
        run: python training/experimental_paddle_training/parity.py
      - name: Test class indexing and input contracts
        run: python -m unittest discover -s training/experimental_paddle_training -p 'test_*.py'
      - name: Prove three native updates and strict checkpoint reload
        run: python training/experimental_paddle_training/smoke.py --steps 3
      - name: Build the actual CLI and isolated RTen probe
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path training/experimental_paddle/runner/Cargo.toml
      - name: Verify adapted ONNX, RTen and actual CLI parity
        run: python training/experimental_paddle_training/export.py --runner training/experimental_paddle/runner/target/release/paddle-rten-probe --cli target/release/ocracle
      - name: Retain this run's native and export evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-training-evidence
          path: |
            training/experimental_paddle_training/parity.json
            training/experimental_paddle_training/smoke.json
            training/experimental_paddle_training/export.json
          if-no-files-found: error
          retention-days: 14

  gallery:
    name: Gallery evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/gallery_export.py --check

  success:
    name: Success
    if: always()
    needs: [rust, msrv, coverage, release-tooling, neural, training, native-training, gallery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check aggregate gate behavior
        run: python3 -m unittest discover -s scripts -p 'test_check_success.py'
      - name: Require every CI dependency to succeed
        env:
          NEEDS_RESULTS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check_success.py

  release:
    name: Publish Rust crate and GitHub release
    needs: [success]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check crates.io publishing credentials
        id: crates-token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Automatic publishing skipped. Set the CARGO_REGISTRY_TOKEN repository secret to enable crates.io and GitHub releases.\n'
            printf '### Automatic publication skipped\n\nSet the `CARGO_REGISTRY_TOKEN` repository secret in Settings → Secrets and variables → Actions to enable crates.io and GitHub releases. This run still builds a versioned crate artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npx semantic-release
        if: steps.crates-token.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Give unreleased builds a unique version
        run: |
          if grep -q '^version = "0\.0\.0"$' Cargo.toml; then
            node scripts/prepare-release.mjs "0.0.${GITHUB_RUN_ID}"
          fi
      - run: cargo package --locked --allow-dirty
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: crate
          path: target/package/ocracle-*.crate
          if-no-files-found: error
